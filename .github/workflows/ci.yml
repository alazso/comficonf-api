name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java (API, demo plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      # A checkout from a repository committed without the executable bit leaves gradlew non-executable.
      - name: Make the Gradle wrapper executable
        run: chmod +x java/gradlew
      - name: Build and test
        working-directory: java
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: |
            java/api/build/libs/*.jar
            examples/demo-plugin/build/libs/*.jar
